<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dustfall</title>
  </head>
  <body>
    <!-- DEEPER cycle 5 (walk-test D-4: "preload the caves on the starting loading screen") — the BOOT
         loading screen. Painted by the browser BEFORE /src/main.ts executes, so it covers the whole
         synchronous boot: terrain ring, the entrance tor, and the ~1.2s origin-cave polygonization +
         collider bake. main.ts removes it on the last line of module init. Styles are INLINE on
         purpose: the stylesheet is injected by the module bundle, i.e. too late to cover boot. -->
    <div id="boot-overlay" style="position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 55%,#2b2118 0%,#140f0b 70%,#0b0806 100%);color:#e8d9c0;font-family:'Courier New',monospace;letter-spacing:0.32em">
      <div style="font-size:34px;font-weight:700">DUSTFALL</div>
      <div style="font-size:12px;opacity:0.55;letter-spacing:0.22em">carving the underworld</div>
    </div>

    <div id="hud">
      <div id="stats">
        <div class="stat-block">
          <div class="stat-label">THIRST</div>
          <div class="stat-track"><div class="stat-fill" id="thirst-bar"></div></div>
        </div>
        <div class="stat-block">
          <div class="stat-label">HUNGER</div>
          <div class="stat-track"><div class="stat-fill hunger" id="hunger-bar"></div></div>
        </div>
        <div class="stat-block">
          <div class="stat-label">TEMPERATURE</div>
          <div class="stat-track temp-track">
            <div class="stat-fill temp-cold" id="temp-cold-bar"></div>
            <div class="stat-fill temp-heat" id="temp-heat-bar"></div>
            <div class="temp-center"></div>
          </div>
        </div>
        <div class="stat-block stamina-block">
          <div class="stat-label">STAMINA</div>
          <div class="stat-track thin"><div class="stat-fill stamina" id="stamina-bar"></div></div>
        </div>
        <div class="stat-block">
          <div class="stat-label">HEALTH</div>
          <div class="stat-track"><div class="stat-fill health" id="health-bar"></div></div>
        </div>
      </div>
      <div id="clock">06:00</div>
      <div id="day-counter">day 1</div>
    </div>
    <div id="crosshair">·</div>
    <div id="damage-vignette"></div>

    <div id="start-overlay" class="overlay">
      <div class="title">DUSTFALL</div>
      <div class="subtitle">the desert is patient</div>
      <div class="controls-hint">
        <div>WASD &nbsp;&mdash;&nbsp; move</div>
        <div>SHIFT &nbsp;&mdash;&nbsp; sprint</div>
        <div>MOUSE &nbsp;&mdash;&nbsp; look</div>
      </div>
      <div class="cta">click to begin</div>
    </div>

    <div id="death-screen" class="overlay hidden">
      <div class="title death">YOU DIED</div>
      <div class="subtitle" id="death-cause">the sun took you</div>
      <div id="days-survived-summary"></div>
      <button id="restart-btn">try again</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

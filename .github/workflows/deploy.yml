# Build Dustfall (Vite + TS) and publish dist/ to GitHub Pages.
#
# Pages source must be set to "GitHub Actions" in Settings → Pages for this
# workflow to actually publish. After that's flipped once, every push to
# master rebuilds + redeploys automatically.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you also trigger a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid stacking deploys — if a new push lands mid-build, queue it but don't
# cancel the in-flight one (cancel-in-progress: false keeps Pages stable).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite build → dist/)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
